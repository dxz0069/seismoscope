[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismoscope"
version = "0.18.0"
description = "Seismoscope (候风) — security audit & verification platform for the Vibe Coding era"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Seismoscope Maintainers"}
]
keywords = ["security", "seismoscope", "vibe-coding", "ai-audit", "vulnerability", "sarif", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "setuptools>=61.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "openai>=1.3.0",
    "anthropic>=0.8.0",
    "httpx>=0.25.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "esprima>=4.0.1",
    "tree-sitter-language-pack==1.13.3",
]

[project.scripts]
vibe-sec = "main:main"
seismoscope = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/dxz0069/seismoscope"
Repository = "https://github.com/dxz0069/seismoscope"
Documentation = "https://github.com/dxz0069/seismoscope#readme"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
core = ["audit/rules/*.yml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "tools*", "api*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendor 的第三方回归快照不参与本仓 lint
extend-exclude = ["tests/regression_fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest_ethereum"
