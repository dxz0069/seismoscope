rules:
  - id: vibe-sec.secret.hardcoded-credential-python
    languages: [python]
    severity: ERROR
    message: A credential-like value is assigned directly in source.
    patterns:
      - pattern-either:
          - pattern: $PASSWORD = "..."
          - pattern: $API_KEY = "..."
          - pattern: $SECRET = "..."
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: (?i).*(password|passwd|pwd).*
