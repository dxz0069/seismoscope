name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 双平台全测；3.12/3.13 在 Linux 上扩展验证
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (error-level only)
        run: ruff check . --select F,E9

      - name: Run tests
        run: pytest tests/ -q -p no:cacheprovider

      # 能力防回退门禁：检测规则变更导致召回下降或 safe 靶场出现误报即失败。
      # 基线更新：python scripts/benchmark_recall.py --json tests/fixtures/benchmark-baseline.json
      - name: Audit capability regression gate
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: python scripts/benchmark_recall.py --compare tests/fixtures/benchmark-baseline.json
