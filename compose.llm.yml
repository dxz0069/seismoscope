services:
  api:
    environment:
      VIBE_SEC_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - deepseek_api_key

  audit:
    environment:
      VIBE_SEC_DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
    secrets:
      - deepseek_api_key

secrets:
  deepseek_api_key:
    file: ${VIBE_SEC_DEEPSEEK_API_KEY_FILE:?Set VIBE_SEC_DEEPSEEK_API_KEY_FILE to a local secret file}
